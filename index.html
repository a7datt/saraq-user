    <meta name="theme-color" content="#000000" />
    <script>
      // Applies the last-known store color instantly, before any CSS/JS loads,
      // so the default blue never has a chance to flash on screen.
      (function () {
        try {
          var raw = localStorage.getItem("saraqib_store_appearance_cache");
          if (!raw) return;
          var a = JSON.parse(raw);
          if (!a || !a.primary_color) return;
          var root = document.documentElement;
          var mode = a.theme_mode;
          if (mode === "system") {
            mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (mode === "dark") root.classList.add("dark");
          var hex = String(a.primary_color).trim().toLowerCase();
          var resolved = a.primary_color;
          if (mode === "dark" && (hex === "#000000" || hex === "#000")) resolved = "#ffffff";
          if (mode === "light" && (hex === "#ffffff" || hex === "#fff")) resolved = "#000000";
          var shade = function (h, percent) {
            var clean = String(h).replace("#", "");
            if (clean.length !== 6) return h;
            var num = parseInt(clean, 16);
            var r = (num >> 16) + Math.round(255 * percent);
            var g = ((num >> 8) & 0x00ff) + Math.round(255 * percent);
            var b = (num & 0x0000ff) + Math.round(255 * percent);
            r = Math.min(255, Math.max(0, r));
            g = Math.min(255, Math.max(0, g));
            b = Math.min(255, Math.max(0, b));
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
          };
          var darkShade = shade(resolved, -0.15);
          var lightShade = shade(resolved, 0.35);
          root.style.setProperty("--brand", resolved);
          root.style.setProperty("--color-brand", resolved);
          root.style.setProperty("--brand-dark", darkShade);
          root.style.setProperty("--brand-light", lightShade);
          root.style.setProperty("--brand-soft", lightShade);
          root.style.setProperty("--color-brand-light", lightShade);
          root.style.setProperty("--color-brand-soft", lightShade);
          root.style.setProperty("--color-primary", resolved);
        } catch (e) {}
      })();
    </script>
